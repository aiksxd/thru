[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "thru"
version = "0.1.0"
edition = "2024"

[dependencies]
thru-core = { path = "crates/thru-core" }
thru-transport = { path = "crates/thru-transport" }
thru-proto-tcp = { path = "crates/thru-proto-tcp" }
thru-dict = { path = "crates/thru-dict" }
thru-fs = { path = "crates/thru-fs" }
thru-exec = { path = "crates/thru-exec" }
crossterm = "0.28"
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
portable-pty = "0.8"
